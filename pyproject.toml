[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirror-pdf-drive"
version = "0.4.0"
description = "CLI to mirror Markdown documentation to PDF on Google Drive"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sebastián Illa" }]
license = { text = "MIT" }
dependencies = [
  "pypandoc>=1.11",
  "weasyprint>=60.0",
  "google-api-python-client>=2.100.0",
  "google-auth-oauthlib>=1.1.0",
  "google-auth>=2.23.0",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "mypy>=1.7", "ruff>=0.1"]

[project.scripts]
mirror-pdf-drive = "mirror_pdf_drive.mirror:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: tests that hit external services (Google Drive). Skipped by default in CI; run with `pytest -m integration`.",
]

[tool.coverage.run]
source = ["src/mirror_pdf_drive"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 0

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
