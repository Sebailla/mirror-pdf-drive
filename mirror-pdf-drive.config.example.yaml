# Example config for mirror-pdf-drive.
# Copy this file to mirror-pdf-drive.config.yaml and adjust paths.

version: 1

source:
  # Directory whose .md files will be converted.
  root: ./Documents-es
  include:
    - "**/*.md"
  exclude: []
  max_depth: 10

output:
  # Directory where PDFs are written. Created if missing.
  root: ./dist/mirror-pdf-drive
  clean: false

render:
  html_template: null
  css_file: null
  page_size: A4
  margins:
    top: 2.0
    bottom: 2.0
    left: 2.0
    right: 2.0
  metadata:
    title: Documents-es
    author: Sebastián Illa

drive:
  # Fixed root folder in Google Drive where all projects are mirrored.
  # The CLI creates a subfolder named `project_folder_name` (or
  # `Path.cwd().name` if not set) inside this root, then mirrors
  # the source tree structure under it.
  # Recommended: a dedicated folder like "Mirror PDFs" in your Drive.
  root_folder_id: null
  # Legacy single-folder target. Kept for backwards compatibility.
  # If both are set, root_folder_id wins.
  folder_id: null
  folder_name: Documents-es PDFs
  # Optional override for the Drive subfolder name. If not set, the
  # CLI uses Path.cwd().name (e.g. "gastos-personales" if you run
  # mirror-pdf-drive from the project root).
  project_folder_name: null
  # One of: skip, replace, version.
  conflict_strategy: skip

auth:
  # Directory where client_secret.json and token.json live.
  # Defaults to ~/.config/mirror-pdf-drive/ when omitted.
  dir: null
  client_secret_file: client_secret.json
  token_file: token.json
